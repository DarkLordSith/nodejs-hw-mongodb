tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: Contact name
            type: string
            example: John Doe
          phoneNumber:
            description: Contact phone number
            type: string
            example: '3805005022223'
          contactType:
            description: Type of contact
            type: string
            enum: ['work', 'home', 'personal']
            example: work
          isFavourite:
            description: Is contact marked as favourite
            type: boolean
            example: true
          email:
            description: Contact email
            type: string
            example: john.doe@example.com
          photo:
            description: Upload image file (optional)
            type: string
            format: binary
responses:
  '201':
    description: Created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
