tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Get all contact
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    schema:
      type: integer
      example: 10
  - name: isFavourite
    in: query
    schema:
      type: boolean
    example: true
  - name: contactType
    in: query
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: work
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
