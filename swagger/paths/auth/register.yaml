tags:
  - Auth
summary: Register user
operationId: registerUser
description: Registers a new user
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
          - name
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            example: newuser@example.com
          password:
            type: string
            example: securepassword123
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: User created successfully
            data:
              $ref: ../../components/schemas/user.yaml
  '400':
    description: Email already in use
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Email already registered
  '401':
    $ref: ../../components/responses/401.yaml
