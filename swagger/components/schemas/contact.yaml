type: object
required:
  - _id
  - userId
  - name
  - phoneNumber
  - email
  - contactType
  - photo
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Contact ID
    example: 605c5edcfc13ae456b000011
  userId:
    type: string
    description: App user ID
    example: 605c5edcfc13ae947b003011
  name:
    type: string
    description: Contact name
    example: John Doe
  phoneNumber:
    type: string
    description: Contact phone number
    example: +38023456789
  email:
    type: string
    description: Contact email
    example: john.doe@example.com
  contactType:
    type: string
    description: Type of contact
    enum: ['work', 'home', 'personal']
    example: work
  photo:
    type: string
    description: Contact photo url
    default: ''
    example: 'https://res.cloudinary.com/dzpdtsced/image/upload/v1743414112/ueqfdjt5…'
  createdAt:
    type: string
    format: date-time
    description: Contact created date
    example: 2025-03-31T09:40:38.435+00:00
  updatedAt:
    type: string
    format: date-time
    description: Contact updated date
    example: 2025-03-31T09:41:53.001+00:00
